<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taireru LLC Redirect</title>
    <style>
        /* Basic reset and centering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .highlight {
            color: #00ffff;
            font-weight: bold;
        }
    </style>
    <script>
        // Redirect after 5 seconds
        setTimeout(() => {
            window.location.href = "https://uniplex.vercel.app";
        }, 5000);
    </script>
</head>
<body>
    <div>
        <h1>Notice</h1>
        <p>
            <span class="highlight">Taireru LLC</span> is no longer active.  
            We have rebranded and our new home is the <span class="highlight">Uniplex</span> website.
        </p>
        <p>You will be redirected shortly...</p>
    </div>
</body>
</html>
